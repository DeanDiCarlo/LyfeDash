name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number to submit to App Store Connect
        required: true
        default: "1"

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./ci/import-signing-assets.sh

      - name: Write Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REQUIRE_SUPABASE_CONFIG: "true"
        run: ./ci/write-supabase-secrets.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project LifeTrack.xcodeproj \
            -scheme LifeTrack \
            -configuration Release \
            -archivePath "$PWD/build/LifeTrack.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/LifeTrack.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$PWD/build/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: ./ci/upload-testflight.sh build/export/LifeTrack.ipa
