name: LifeTrack
options:
  bundleIdPrefix: com.deanomeano
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  LifeTrack:
    type: application
    platform: iOS
    sources:
      - apps/ios/LifeTrack
    info:
      path: apps/ios/LifeTrack/Resources/Info.plist
    entitlements:
      path: apps/ios/LifeTrack/Resources/LifeTrack.entitlements
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deanomeano.lifetrack
        PRODUCT_NAME: LifeTrack
        TARGETED_DEVICE_FAMILY: "1"
  LifeTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - apps/ios/LifeTrackTests
    dependencies:
      - target: LifeTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deanomeano.lifetrack.tests
schemes:
  LifeTrack:
    build:
      targets:
        LifeTrack: all
    test:
      targets:
        - LifeTrackTests
