name: LifeTrack
options:
  bundleIdPrefix: com.deanomeano
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LifeTrack:
    type: application
    platform: iOS
    sources:
      - ios/LifeTrack
    info:
      path: ios/LifeTrack/Info.plist
    entitlements:
      path: ios/LifeTrack/LifeTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deanomeano.lifetrack
        PRODUCT_NAME: LifeTrack
        TARGETED_DEVICE_FAMILY: "1"
  LifeTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ios/LifeTrackTests
    dependencies:
      - target: LifeTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deanomeano.lifetrack.tests
